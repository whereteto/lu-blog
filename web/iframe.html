    <br>
    <iframe id="my-iframe" src="https://www.wikipedia.org" style="width: 100%; height: 500px; border: 1px solid #ff6565; border-radius: 8px;" title="Embedded content"></iframe>
    
    <script>
        function handleEnter(event) {
            if (event.key === 'Enter') {
                let url = document.getElementById('url-input').value;
                if (url) {
                    if (!url.startsWith('http://') && !url.startsWith('https://')) {
                        url = 'https://' + url;
                    }
                    document.getElementById('my-iframe').src = url;
                }
            }
        }
    </script>

    function getFlagEmoji(countryCode) {
        if (!countryCode) return '🏳️';
        return countryCode.toUpperCase().replace(/./g, char => 
            String.fromCodePoint(127397 + char.charCodeAt(0))
        );
    }

    fetch('https://ipwho.is/')
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                const flag = getFlagEmoji(data.country_code);
                const infoDiv = document.getElementById('location-info');
                infoDiv.innerHTML = `${flag} ${data.city},`;
